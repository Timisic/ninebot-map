<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>骑行地图</title>
<script src="./theme-init.js"></script>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./vendor/leaflet/leaflet.css"><link rel="stylesheet" href="./styles.css">
<script src="./vendor/leaflet/leaflet.js" defer></script><script type="module" src="./app.mjs"></script>
</head>
<body>
<header class="topbar">
  <div class="title"><h1 id="page-title">骑行地图</h1><span id="local-status" role="status" aria-live="polite">正在读取数据</span></div>
  <div class="actions">
    <button id="theme-toggle" type="button" aria-label="切换为浅色" title="切换为浅色"></button>
    <button id="toggle-places" aria-expanded="false" aria-controls="places-panel">常去地点</button>
  </div>
</header>
<main id="workspace">
  <div id="map" aria-label="骑行轨迹地图" tabindex="0"></div>
  <section class="toolbar" aria-label="地图筛选">
    <div class="metrics" aria-live="polite"><span id="visible-stat">当前地图 <strong>暂无数据</strong></span><span id="history-stat">全部历史 <strong>暂无数据</strong></span><span id="updated-at"></span></div>
    <details id="date-panel"><summary>日期</summary><div class="date-controls"><label>开始日期<input id="from" type="date" disabled></label><label>结束日期<input id="to" type="date" disabled></label><button id="clear-dates" disabled>全部日期</button></div></details>
  </section>
  <aside id="places-panel" aria-label="常去地点">
    <div class="panel-heading"><div><h2>常去地点</h2><span id="place-total">0 处</span></div><button id="close-places" type="button">关闭</button></div>
    <ol id="places"></ol><p id="places-empty">数据就绪后显示常去地点。</p>
    <section class="place-detail" aria-label="所选地点">
      <p id="selection-empty">选择地点，查看相关路线。</p>
      <div id="selection-summary" hidden><div class="selection-heading"><strong id="selection-name"></strong><button id="clear-selection" type="button" class="text-button">取消选择</button></div><p id="selection-count"></p><div class="detail-actions"><button id="locate-place" type="button">在地图中定位</button><button id="edit-place" type="button">命名</button></div></div>
      <form id="label-form" hidden><label for="place-label">地点名称</label><div class="label-row"><input id="place-label" maxlength="40" autocomplete="off"><button type="submit">保存</button><button id="cancel-edit" type="button">取消</button></div><p id="label-note" role="status"></p></form>
    </section>
    <details class="place-method"><summary>次数怎么算？</summary><p>每条轨迹的终点计一次，在约 100 米范围内聚合。它表示行程结束，不代表停留时长或已确认到访。名称只保存在此浏览器的当前地址。</p></details>
  </aside>
  <section id="empty" class="empty-state"><h2 id="empty-title">地图数据尚未发布</h2><p id="empty-description">数据就绪后会自动显示，请稍后刷新。</p></section>
  <div class="map-settings">
    <button id="fit" aria-label="查看全部路线" disabled>全图</button>
    <details id="map-options"><summary>图层</summary><div class="settings-content">
      <h2>地图显示</h2>
      <label class="check"><span>道路底图</span><input id="basemap" type="checkbox" disabled></label>
      <label class="check"><span>经过次数</span><input id="show-grid" type="checkbox" disabled></label>
    </div></details>
  </div>
  <div class="route-legend" aria-label="路线叠加，颜色越强表示重复经过越多"><span>路线叠加</span><i></i><i></i><i></i><span>多</span></div>
  <div id="cell-info" class="cell-info" hidden role="status"></div>
  <div id="error" class="error" role="alert" hidden></div>
</main>
</body></html>
