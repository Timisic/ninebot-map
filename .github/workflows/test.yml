name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: ./scripts/setup.sh
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: ./run validate examples/ride-dataset.json
      - name: Verify repository contains no runtime data
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.private|data|work|outputs|\.venv)/'; then
            exit 1
          fi
