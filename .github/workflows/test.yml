name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: ./scripts/setup.sh
      - run: .venv/bin/python scripts/check-project.py
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: ./run validate examples/ride-dataset.json
      - name: Verify map calculations
        run: node --test tests/map-model.test.mjs
      - name: Verify repository contains no runtime data
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.private|data|work|outputs|\.venv)/'; then
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.11'
      - run: ./scripts/setup.sh
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify map, wheel input, and live refresh
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node scripts/verify.mjs --suite map --output work/verification/ci-map
          node scripts/verify.mjs --suite wheel --output work/verification/ci-wheel
          node scripts/verify.mjs --suite refresh --output work/verification/ci-refresh
          node scripts/verify.mjs --suite static --output work/verification/ci-static
      - name: Retain synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: map-verification-evidence
          path: work/verification/
          retention-days: 7
